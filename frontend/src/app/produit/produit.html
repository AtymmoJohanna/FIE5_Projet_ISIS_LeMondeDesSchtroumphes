<div class="produit-layout">
  @for (f of gameService.flottants(); track f.n) {
  @if (f.id === prod()?.id) {
  <span class="flottant">{{ f.text }}</span>
  }
  }
  <!-- Partie gauche : image du produit avec sa quantité superposée (clic = lancer la production) -->
  <div class="produit-image" (click)="startFabrication()">
    <img class="round" [src]="gameService.server() + '/' + prod()?.logo" [alt]="prod()?.name" />
    <span class="quantite-badge">{{ prod()?.quantite }}</span>
  </div>

  <!-- Partie droite : production (haut) + achat (bas) -->
  <div class="produit-droite">
    <!-- Partie haute : barre de progression + gain -->
    <div class="produit-production" (click)="startFabrication()">
      <div class="progressbar">
        <div class="fill" [style.width.%]="progress()"></div>
      </div>
      <span class="gain">
        {{ (prod()?.revenu ?? 0) * (prod()?.quantite ?? 0) * gameService.angelMultiplier() | bigvalue }}
      </span>
    </div>

    <!-- Partie basse : achat -->
    <div class="produit-achat">
      <div class="nom-produit">{{ prod()?.name }}</div>
      <button class="buy-button" [disabled]="!canBuy()" (click)="acheter()">
        Buy x{{ numberToBuy() }} — <span [innerHTML]="coutAchat() | bigvalue"></span>
      </button>
      <span class="timeleft">{{ timeleft() | second }}</span>
    </div>
  </div>
</div>
