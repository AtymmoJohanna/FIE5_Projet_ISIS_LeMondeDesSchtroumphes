<div class="header">
  <div class="world-info">
    <img class="round" [src]="gameService.server() + '/' + world()?.logo" />
    <span class="world-name">{{ world()?.name }}</span>
  </div>

  <div class="money">
    <span id="money" [innerHTML]="(world()?.money ?? 0) | bigvalue"></span>
  </div>

  <div class="qtmulti">
    <button mat-raised-button color="primary">
      x1
    </button>
  </div>

  <div class="userid">
    <span>Your ID :</span>
    <input type="text" placeholder="pseudo" />
  </div>
</div>

<div class="main">
  <div class="menu">
    <button mat-raised-button color="primary" class="actionb">
      Unlocks
    </button>
    <button mat-raised-button color="primary" class="actionb">
      Cash Upgrades
    </button>
    <button mat-raised-button color="primary" class="actionb">
      Angel Upgrades
    </button>
    <button mat-raised-button color="primary" class="actionb">
      Managers
    </button>
    <button mat-raised-button color="primary" class="actionb">
      Investors
    </button>
  </div>

  <div class="products">
    @for (product of world()?.products ?? []; track product.id) {
      <app-produit
        [prod]="product"
        class="product">
      </app-produit>
    }
  </div>
</div>
